services:
  - type: web
    name: placement-prep-generator
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: MAX_REVISIONS
        value: "2"
      - key: DEBUG
        value: "false"
    plan: free
